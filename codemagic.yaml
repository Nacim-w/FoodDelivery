trigger:
  events:
    - push
  branch_patterns:
    - pattern: main
      include: true

workflows:
  flutter-android:
    name: Firebase CI/CD (Dev Flavor)
    environment:
      flutter: 3.32.0
      groups:
        - testers
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Setup the keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF

      - name: Bump versionCode and versionName
        script: |
          cd $CM_BUILD_DIR
          VERSION_CODE=$(date +%s)
          MAJOR=1
          MINOR=2
          PATCH=0
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "Setting versionCode=$VERSION_CODE and versionName=$VERSION_NAME"
          sed -i.bak -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i.bak -E "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Clean old builds
        script: |
          cd $CM_BUILD_DIR
          flutter clean
          rm -f pubspec.lock

      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Build APK (Dev Flavor)
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --release -t lib/main_development.dart --flavor dev

      - name: Verify APK exists (Dev Flavor)
        script: |
          cd $CM_BUILD_DIR
          if [ ! -f build/app/outputs/flutter-apk/app-dev-release.apk ]; then
            echo "Dev APK not found! Build failed."
            exit 1
          fi

      - name: Authenticate Firebase CLI
        script: |
          echo $FIREBASE_SERVICE_ACCOUNT | base64 --decode > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json

      - name: Distribute via Firebase App Distribution (Dev Flavor)
        script: |
          cd $CM_BUILD_DIR
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk \
            --app 1:540049131134:android:74e974643a939bc2317a2f \
            --groups "testers" \
            --release-notes-file android/release_notes.txt

    artifacts:
      - build/app/outputs/flutter-apk/app-dev-release.apk

    publishing:
      email:
        recipients:
          - msallemnacim@gmail.com
        notify:
          success: true
          failure: true
